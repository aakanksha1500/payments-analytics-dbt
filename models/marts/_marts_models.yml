models:
  - name: dim_merchant
    description: One row per merchant version (SCD2). A new version starts whenever a merchant's attributes change.
    columns:
      - name: merchant_version_key
        description: Primary key. Identifies one version of one merchant.
        data_tests:
          - unique
          - not_null

      - name: merchant_id
        data_tests:
          - not_null

      - name: merchant_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'silver', 'gold']
  
  - name: dim_date
    description: One row per calendar day.
    columns:
      - name: date_day
        description: Primary key.
        data_tests:
          - unique
          - not_null
  
  - name: fct_transactions
    description: One row per transaction.
    columns:
      - name: transaction_id
        description: Primary key. Identifies one transaction.
        data_tests:
          - unique
          - not_null

      - name: merchant_version_key
        description: Foreign key to dim_merchant.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_version_key

      - name: transaction_date
        description: The date of the transaction.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      
      - name: amount_eur
        description: The amount of the transaction, converted to EUR at the rate valid on the transaction date.
        data_tests:
          - not_null