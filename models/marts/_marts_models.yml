models:
  - name: dim_merchant
    description: One row per merchant version (SCD2), built from the merchants snapshot. A new version starts whenever a merchant's attributes change.
    columns:
      - name: merchant_version_key
        description: Primary key. Identifies one version of one merchant (dbt_scd_id from the snapshot).
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: merchant_id
        description: The merchant. Repeats across versions.
        data_type: varchar
        constraints:
          - type: not_null
      - name: merchant_name
        data_type: varchar
      - name: merchant_category
        data_type: varchar
      - name: merchant_tier
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'silver', 'gold']
      - name: country_code
        data_type: varchar
      - name: onboarded_at
        data_type: timestamp
      - name: valid_from
        description: Start of the period this version was valid (inclusive). The merchant's updated_at when the change happened.
        data_type: timestamp
        constraints:
          - type: not_null
      - name: valid_to
        description: End of the period this version was valid (exclusive). Current versions end at 9999-12-31.
        data_type: timestamp
        constraints:
          - type: not_null
      - name: is_current
        description: True for the version valid now. Exactly one per merchant.
        data_type: boolean

  - name: dim_date
    description: One row per calendar day, from dbt_utils.date_spine over the range set in vars.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Primary key.
        data_type: date
        granularity: day
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: year
        data_type: bigint
      - name: month
        data_type: bigint
      - name: day_of_month
        data_type: bigint
      - name: day_of_week
        description: 0 = Sunday, 6 = Saturday.
        data_type: bigint
      - name: is_weekend
        data_type: boolean

  - name: fct_transactions
    description: One row per payment attempt (approved or declined), with the EUR amount and the merchant version valid at the time of payment. Incremental, with a lookback window for late-arriving rows.
    semantic_model:
      enabled: true
      name: transactions
    agg_time_dimension: transaction_date
    columns:
      - name: transaction_id
        description: Primary key. Identifies one transaction.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
        entity:
          name: transaction
          type: primary
      - name: merchant_id
        data_type: varchar
        constraints:
          - type: not_null
        entity:
          name: merchant
          type: foreign
      - name: merchant_version_key
        description: Foreign key to dim_merchant. The merchant version valid at transaction_at.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_version_key
      - name: merchant_tier
        description: The merchant's tier at the time of the payment.
        data_type: varchar
        dimension:
          type: categorical
      - name: merchant_category
        data_type: varchar
        dimension:
          type: categorical
      - name: terminal_id
        description: Can be null (planted problem). See has_terminal.
        data_type: varchar
      - name: has_terminal
        data_type: boolean
      - name: transaction_at
        data_type: timestamp
        constraints:
          - type: not_null
      - name: transaction_date
        description: The date of the transaction (UTC).
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
        granularity: day
        dimension:
          type: time
      - name: loaded_at
        description: When the row arrived. Can be up to 3 days after transaction_at.
        data_type: timestamp
      - name: status
        data_type: varchar
        dimension:
          type: categorical
      - name: card_scheme
        data_type: varchar
        dimension:
          type: categorical
      - name: currency_code
        data_type: varchar
        dimension:
          type: categorical
      - name: amount
        description: Amount in the original currency.
        data_type: decimal(18,2)
      - name: fx_rate_date
        description: Date of the FX rate used for amount_eur. Null for EUR payments.
        data_type: date
      - name: amount_eur
        data_type: decimal(18,2)
        constraints:
          - type: not_null
    metrics:
      - name: gross_payment_volume_eur
        description: Sum of approved payments in EUR.
        type: simple
        agg: sum
        expr: "case when status = 'approved' then amount_eur else 0 end"
      - name: approved_payment_count
        description: Number of approved payments.
        type: simple
        agg: sum
        expr: "case when status = 'approved' then 1 else 0 end"

  - name: fct_daily_settlement
    description: One row per merchant per day with any activity. Settlement is approved payments minus refunds minus chargebacks, in EUR, each dated by its own event.
    semantic_model:
      enabled: true
      name: daily_settlement
    agg_time_dimension: settlement_date
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "settlement_eur = payments_eur - refunds_eur - chargebacks_eur"
    columns:
      - name: settlement_key
        description: Primary key, merchant_id and settlement_date.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
        entity:
          name: settlement
          type: primary
      - name: merchant_id
        data_type: varchar
        constraints:
          - type: not_null
        entity:
          name: merchant
          type: foreign
      - name: settlement_date
        data_type: date
        constraints:
          - type: not_null
        dimension:
          type: time
        granularity: day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: payment_count
        data_type: bigint
      - name: refund_count
        data_type: bigint
      - name: chargeback_count
        data_type: bigint
      - name: payments_eur
        data_type: decimal(18,2)
        data_tests:
          - amount_reconciles:
              arguments:
                compare_model: ref('fct_transactions')
                compare_column: amount_eur
                compare_where: "status = 'approved'"
      - name: refunds_eur
        data_type: decimal(18,2)
        data_tests:
          - amount_reconciles:
              arguments:
                compare_model: ref('int_refunds_matched')
                compare_column: amount_eur
      - name: chargebacks_eur
        data_type: decimal(18,2)
        data_tests:
          - amount_reconciles:
              arguments:
                compare_model: ref('int_chargebacks_matched')
                compare_column: amount_eur
                compare_where: "merchant_id is not null"
      - name: settlement_eur
        description: Can be negative when refunds and chargebacks exceed payments on a day.
        data_type: decimal(18,2)
        constraints:
          - type: not_null
    metrics:
      - name: settlement_eur
        description: Total settlement amount in EUR.
        type: simple
        agg: sum
        expr: settlement_eur
      - name: settled_payment_count
        description: Total number of settled payments.
        type: simple
        agg: sum
        expr: payment_count
      - name: refund_count
        description: Total number of refunds.
        type: simple
        agg: sum
        expr: refund_count
      - name: chargeback_count
        description: Total number of chargebacks.
        type: simple
        agg: sum
        expr: chargeback_count

  - name: dim_merchant_current
    description: One row per merchant, with the current version's attributes. Built from dim_merchant.
    semantic_model:
      enabled: true
      name: merchants
    columns: 
      - name: merchant_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
        entity:
          name: merchant
          type: primary 
      - name: merchant_name
        data_type: varchar
      - name: merchant_category
        data_type: varchar
        dimension:
          type: categorical
      - name: merchant_tier
        data_type: varchar
        dimension:
          type: categorical
      - name: country_code
        data_type: varchar
        dimension:
          type: categorical
  
  - name: merchant_risk_flags
    description: One row per merchant, with risk flags set according to the rules in design.md.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('dim_merchant_current')
    columns:
      - name: merchant_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: merchant_category
        data_type: varchar
      - name: approved_payment_count
        data_type: hugeint
      - name: refund_count
        data_type: hugeint
      - name: chargeback_count
        data_type: hugeint
      - name: over_refund_count
        data_type: bigint
      - name: chargeback_rate
        data_type: double
      - name: refund_rate
        data_type: double
      - name: category_median_chargeback_rate
        data_type: double
      - name: flag_high_refunds
        data_type: boolean
      - name: flag_high_chargebacks
        data_type: boolean
      - name: flag_over_refund
        data_type: boolean
      - name: is_high_risk
        data_type: boolean
      - name: as_of_date
        data_type: date
      - name: high_refund_terminal_count
        data_type: hugeint
      - name: flag_high_refund_terminal
        data_type: boolean

metrics:
  - name: chargeback_rate
    description: Chargebacks received divided by approved payments in the same period (count-based, as in design.md).
    type: ratio
    numerator: chargeback_count
    denominator: settled_payment_count

  - name: refund_rate
    description: Refunds issued divided by approved payments in the same period (count-based).
    type: ratio
    numerator: refund_count
    denominator: settled_payment_count